name: CI/CD

on:
  push:
    branches: [main, versions]
  pull_request:
    branches: [main, versions]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Check backend exists
        id: check
        run: test -f go.mod
        working-directory: .
        continue-on-error: true

      - uses: actions/setup-go@v5
        if: steps.check.outcome == 'success'
        with:
          go-version-file: backend/go.mod

      - name: Download dependencies
        if: steps.check.outcome == 'success'
        run: go mod download

      - name: Vet
        if: steps.check.outcome == 'success'
        run: go vet ./...

      - name: Test
        if: steps.check.outcome == 'success'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build
        if: steps.check.outcome == 'success'
        run: go build -o posa-backend ./...

      - name: Upload coverage
        if: steps.check.outcome == 'success' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  ai-engine:
    name: AI Engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ai directory exists
        id: check
        run: test -d ai && test -f ai/requirements.txt
        continue-on-error: true

      - uses: actions/setup-python@v5
        if: steps.check.outcome == 'success'
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.check.outcome == 'success'
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt

      - name: Lint
        if: steps.check.outcome == 'success'
        run: |
          pip install flake8
          flake8 ai/

      - name: Test
        if: steps.check.outcome == 'success'
        run: PYTHONPATH=. pytest ai/tests/ --tb=short -q

      - name: Skip notice
        if: steps.check.outcome != 'success'
        run: echo "ai/ directory not found — skipping"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend exists
        id: check
        run: test -d frontend && test -f frontend/package.json
        continue-on-error: true

      - uses: actions/setup-node@v4
        if: steps.check.outcome == 'success'
        with:
          node-version: '22'

      - name: Install
        if: steps.check.outcome == 'success'
        run: cd frontend && npm ci

      - name: Lint
        if: steps.check.outcome == 'success'
        run: cd frontend && npm run lint --if-present

      - name: Build
        if: steps.check.outcome == 'success'
        run: cd frontend && npm run build

      - name: Skip notice
        if: steps.check.outcome != 'success'
        run: echo "frontend/ directory not found — skipping"

  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check contracts exist
        id: check
        run: test -d contracts
        continue-on-error: true

      - name: Validate contract syntax
        if: steps.check.outcome == 'success'
        run: |
          cd contracts
          echo "Contract validation placeholder"
          # flow project deploy --update (Flow)
          # cargo build --release (NEAR/Rust)

      - name: Skip notice
        if: steps.check.outcome != 'success'
        run: echo "contracts/ directory not found — skipping"
