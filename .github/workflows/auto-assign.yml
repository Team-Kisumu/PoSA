name: Auto Assign

on:
  pull_request:
    types: [opened, ready_for_review]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  assign-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR to author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [pr.user.login]
            });

      - name: Auto-label PR by changed paths
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const labels = new Set();
            for (const f of files) {
              if (f.filename.startsWith('backend/'))   labels.add('backend');
              if (f.filename.startsWith('frontend/'))  labels.add('frontend');
              if (f.filename.startsWith('ai/'))        labels.add('ai-engine');
              if (f.filename.startsWith('contracts/')) labels.add('blockchain');
              if (f.filename.startsWith('.github/'))   labels.add('ci/cd');
              if (f.filename.endsWith('.md'))          labels.add('documentation');
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [...labels]
              });
            }

  assign-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to opener
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: [context.payload.issue.user.login]
            });
