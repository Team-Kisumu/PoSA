name: Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label by title keywords
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];

            if (title.includes('bug') || title.includes('fix') || title.includes('error'))
              labels.push('bug');
            if (title.includes('feature') || title.includes('enhancement') || title.includes('request'))
              labels.push('enhancement');
            if (title.includes('security') || title.includes('vuln') || title.includes('cve'))
              labels.push('security');
            if (title.includes('docs') || title.includes('readme') || title.includes('documentation'))
              labels.push('documentation');
            if (title.includes('ai') || title.includes('evaluator') || title.includes('model'))
              labels.push('ai-engine');
            if (title.includes('blockchain') || title.includes('contract') || title.includes('chain'))
              labels.push('blockchain');
            if (title.includes('frontend') || title.includes('ui') || title.includes('ux'))
              labels.push('frontend');
            if (title.includes('backend') || title.includes('api') || title.includes('server'))
              labels.push('backend');

            if (labels.length === 0) labels.push('triage');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels
            });

  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issues without body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            if (!body || body.trim().length < 20) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ This issue has little or no description. Please provide more details so we can triage effectively.'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-info']
              });
            }
