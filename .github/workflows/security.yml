name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go vulnerability check
        if: hashFiles('backend/go.mod') != ''
        run: |
          echo "Running Go vulnerability check..."
      - uses: actions/setup-go@v5
        if: hashFiles('backend/go.mod') != ''
        with:
          go-version-file: backend/go.mod
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./... || true
        if: hashFiles('backend/go.mod') != ''

      - name: Python dependency audit
        if: hashFiles('ai/requirements.txt') != ''
        run: echo "Running Python audit..."
      - uses: actions/setup-python@v5
        if: hashFiles('ai/requirements.txt') != ''
        with:
          python-version: '3.10'
      - run: |
          pip install pip-audit
          cd ai && pip install -r requirements.txt && pip-audit || true
        if: hashFiles('ai/requirements.txt') != ''

      - name: Node dependency audit
        if: hashFiles('frontend/package.json') != ''
        run: echo "Running Node audit..."
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: '18'
      - run: cd frontend && npm ci && npm audit --audit-level=high || true
        if: hashFiles('frontend/package.json') != ''

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript, python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
