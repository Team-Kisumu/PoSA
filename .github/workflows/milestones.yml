name: Milestone Tracker

on:
  issues:
    types: [closed, opened, reopened]

permissions:
  issues: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Report milestone progress
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue.milestone) return;

            const milestone = await github.rest.issues.getMilestone({
              owner: context.repo.owner,
              repo: context.repo.repo,
              milestone_number: issue.milestone.number
            });

            const m = milestone.data;
            const total = m.open_issues + m.closed_issues;
            const pct = total > 0 ? Math.round((m.closed_issues / total) * 100) : 0;
            const bar = '█'.repeat(Math.floor(pct / 5)) + '░'.repeat(20 - Math.floor(pct / 5));

            const body = [
              `### 📊 Milestone: **${m.title}**`,
              ``,
              `\`${bar}\` **${pct}%** (${m.closed_issues}/${total})`,
              ``,
              `| Status | Count |`,
              `|--------|-------|`,
              `| ✅ Closed | ${m.closed_issues} |`,
              `| 🔓 Open | ${m.open_issues} |`,
              m.due_on ? `| 📅 Due | ${new Date(m.due_on).toLocaleDateString()} |` : '',
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
